server:
  port: 8080

spring:
  application:
    name: test
  datasource:
    url: ${DBMS_CONNECTION}
    username: ${DBMS_USERNAME}
    password: ${DBMS_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO}
    show-sql: false
  security:
    admin-full-permission: true
  output:
    ansi:
      enabled: ALWAYS
  mail:
    host: ${SMTP_HOST}
    port: 587
    username: ${SMTP_EMAIL}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  singerKey: ${SINGER_KEY}
