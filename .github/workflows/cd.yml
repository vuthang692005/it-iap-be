name: Continuous Deployment (CD)

on:
  workflow_run:
    workflows: [ "Continuous Integration (CI)" ]
    types:
      - completed
    branches:
      - master # CHỈ nghe sự kiện hoàn thành trên nhánh master

jobs:
  build-and-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./ # Đường dẫn tới Dockerfile Backend
          push: true
          tags: minhthang6969/testbe:latest

      - name: SSH to VPS and Restart Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker compose pull be
            docker compose up -d --no-deps be
            docker system prune -f